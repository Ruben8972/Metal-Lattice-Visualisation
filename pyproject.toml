[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-lattice-visualisation"
version = "0.2.2"
description = "Interactive visualization of BCC, FCC, and HCP crystal lattices with PyVista."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyvista",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pytest",
]

[project.scripts]
metal-lattice-vis = "vis.main:main"

[project.gui-scripts]
metal-lattice-vis-gui = "vis.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
