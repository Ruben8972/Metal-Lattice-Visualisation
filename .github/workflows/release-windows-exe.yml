name: release-windows-exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q

      - name: Build .exe with PyInstaller
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Metallgitter-Visualisierung main.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metallgitter-Visualisierung-windows-exe
          path: dist/Metallgitter-Visualisierung.exe

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Metallgitter-Visualisierung.exe
